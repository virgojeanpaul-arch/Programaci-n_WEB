<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de números reales</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eff6ff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor {
            width: 90%;
            max-width: 700px;
            background-color: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-top: 0;
        }

        .descripcion {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        .entrada {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 7px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            font-size: 17px;
            border: 2px solid #bfdbfe;
            border-radius: 8px;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: #2563eb;
        }

        .botones {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        .boton {
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            cursor: pointer;
            color: white;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, opacity 0.2s;
        }

        .boton:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .boton img {
            width: 25px;
            height: 25px;
        }

        .calcular {
            background-color: #2563eb;
        }

        .limpiar {
            background-color: #dc2626;
        }

        .creditos {
            background-color: #16a34a;
        }

        h2 {
            color: #1e3a8a;
            font-size: 20px;
            margin-bottom: 10px;
        }

        #registro {
            width: 100%;
            height: 220px;
            resize: vertical;
            padding: 12px;
            border: 2px solid #bfdbfe;
            border-radius: 8px;
            background-color: #f8fafc;
            font-family: "Courier New", monospace;
            font-size: 14px;
            color: #1e293b;
        }

        .resultado {
            background-color: #eff6ff;
            border-left: 5px solid #2563eb;
            padding: 12px;
            margin-top: 20px;
            border-radius: 5px;
            display: none;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .contenedor {
                padding: 20px;
            }

            .boton {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <h1>Calculadora de números reales</h1>

        <p class="descripcion">
            Ingrese dos números reales y presione el botón calcular.
        </p>

        <div class="entrada">
            <label for="numero1">Primer número:</label>
            <input type="number" id="numero1" step="any" placeholder="Ejemplo: 15.5">
        </div>

        <div class="entrada">
            <label for="numero2">Segundo número:</label>
            <input type="number" id="numero2" step="any" placeholder="Ejemplo: 4.2">
        </div>

        <div class="botones">

            <button class="boton calcular" onclick="calcular()">
                <img src="https://cdn-icons-png.flaticon.com/512/1828/1828640.png"
                     alt="Calcular">
                Calcular
            </button>

            <button class="boton limpiar" onclick="limpiar()">
                <img src="https://cdn-icons-png.flaticon.com/512/1214/1214428.png"
                     alt="Limpiar">
                Limpiar
            </button>

            <button class="boton creditos" onclick="verCreditos()">
                <img src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png"
                     alt="Créditos">
                Créditos
            </button>

        </div>

        <div id="resultado" class="resultado"></div>

        <h2>Registro de operaciones</h2>

        <textarea id="registro"
                  readonly
                  placeholder="Aquí aparecerá el registro de las operaciones realizadas..."></textarea>

        <footer>
            Calculadora de operaciones matemáticas
        </footer>

    </main>

    <script>
        function calcular() {

            const numero1 = parseFloat(document.getElementById("numero1").value);
            const numero2 = parseFloat(document.getElementById("numero2").value);
            const registro = document.getElementById("registro");
            const resultado = document.getElementById("resultado");

            // Validar que ambos números hayan sido ingresados
            if (isNaN(numero1) || isNaN(numero2)) {
                alert("Por favor, ingrese los dos números reales.");
                return;
            }

            // Operaciones
            const suma = numero1 + numero2;
            const resta = numero1 - numero2;
            const producto = numero1 * numero2;

            let division;

            if (numero2 === 0) {
                division = "No definida (división entre cero)";
            } else {
                division = numero1 / numero2;
            }

            // Mostrar resultados
            resultado.style.display = "block";

            resultado.innerHTML =
                "<strong>Resultados:</strong><br>" +
                "Suma: " + suma + "<br>" +
                "Resta: " + resta + "<br>" +
                "Producto: " + producto + "<br>" +
                "División: " + division;

            // Obtener fecha y hora
            const ahora = new Date();
            const fecha = ahora.toLocaleString("es-PE");

            // Crear registro
            let nuevoRegistro =
                "========================================\n" +
                "Fecha: " + fecha + "\n" +
                "Números ingresados: " + numero1 + " y " + numero2 + "\n" +
                "Suma:       " + suma + "\n" +
                "Resta:      " + resta + "\n" +
                "Producto:   " + producto + "\n" +
                "División:   " + division + "\n" +
                "========================================\n";

            // Agregar el nuevo registro sin borrar los anteriores
            registro.value += nuevoRegistro;
        }

        function limpiar() {

            document.getElementById("numero1").value = "";
            document.getElementById("numero2").value = "";
            document.getElementById("resultado").style.display = "none";

            document.getElementById("numero1").focus();
        }

        function verCreditos() {

            alert(
                "CRÉDITOS\n\n" +
                "Calculadora de números reales\n" +
                "Autor: Alejandro Salazar \n" +
                "Curso: Programación Web\n" +
                "Tecnologías: HTML, CSS y JavaScript"
            );
        }
    </script>

</body>
</html>
