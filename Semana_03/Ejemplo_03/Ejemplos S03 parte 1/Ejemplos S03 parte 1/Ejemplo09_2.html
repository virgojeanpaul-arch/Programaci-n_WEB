	<body>
		<script>
			//uso de funciones
			//uso de operador ternario (condicion)? <inst1> : <inst2>
			
			function calcularPromedio(n1, n2, n3) {
			  return (n1 + n2 + n3) / 3;
			}

			function obtenerEstado(promedio) {
			  return promedio >= 11
				? "Aprobado"
				: "Desaprobado";
			}

			const promedio = calcularPromedio(14, 16, 13);
			const estado = obtenerEstado(promedio);
			
			const estado2 = obtenerEstado ( calcularPromedio(10, 12, 13));

			console.log("Promedio:", promedio);
			console.log("Estado1:", estado);
			console.log("Estado2:", estado2);
			
			
		</script>
	</body>
