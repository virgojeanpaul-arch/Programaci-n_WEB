		//USP DE METODOS (FUNCIONES) EN JAVASCRIPT
			function calcularPromedio(nota1, nota2, nota3) {
			  return (nota1 + nota2 + nota3) / 3;
			}

			const promedio1 = calcularPromedio(15, 18, 17);
			console.log("Promedio:", promedio1);
			
			
			
			function determinarEstado(promedio) {
			  if (promedio >= 11) {
				return "Aprobado";
			  }
			  return "Desaprobado";
			}
			
			const promedio2 = 14;
			console.log(determinarEstado(promedio2));
			
			
		</script>
