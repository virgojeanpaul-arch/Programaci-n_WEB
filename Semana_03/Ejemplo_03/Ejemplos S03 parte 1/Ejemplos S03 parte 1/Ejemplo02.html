<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">	
		<title> Ejemplos uso javascript	</title>

	
	</head>
	
	<body>
		<h2> Ejemplo 2. Tipos de datos  </h2>
		<p> Abre el panel de consola: CTRL + SHIFT + J o F12</p>

		
	<script>	
		//declarar e inicializar las variables 
		let nombre = "Jean Paul";
		let genero = 'M';
		let edad = 19;
		let sueldo = 1400.75;
		let esPeruano = true;
		let notas = [17, 19, 20];		
		
		//imprimir los valores de cada variable y su respectivo tipo en consola
		console.log("Nombre: " + nombre + ", Tipo: " + typeof nombre );
		console.log("Genero: " + genero + ", Tipo: " + typeof genero );
		console.log("Edad: " + edad + ", Tipo: " + typeof edad );
		console.log("Sueldo: " + sueldo + ", Tipo: " + typeof sueldo );
		console.log("Es peruano?: " + esPeruano + ", Tipo: " + typeof esPeruano );		
		
		

		
	</script>
		
	</body>

</html>
